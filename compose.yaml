services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controle_pedidos
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d controle_pedidos"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Production image; run with `docker compose --profile app up --build`.
  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/controle_pedidos
    ports:
      - "3000:3000"

volumes:
  db-data:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controle_pedidos
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d controle_pedidos"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
